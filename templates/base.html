<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ASDC Attendance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="{% url 'dashboard:home' %}">ASDC Attendance</a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">{{ request.user.email }}</span>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="d-flex">

    <div class="bg-light border-end" style="width: 220px; min-height: calc(100vh - 56px);">
        <ul class="nav flex-column p-3">
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'dashboard:home' %}">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'members:list' %}">Members</a>
            </li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
